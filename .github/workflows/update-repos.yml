# Refreshes repos.json every six hours so the Projects folder on the site shows new GitHub repositories by itself.
name: Update repository list

on:
  schedule:
    - cron: "0 */6 * * *"   # every six hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python automation/update_repos.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if the list changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add repos.json
          git diff --cached --quiet || git commit -m "Update repository list"
          git push
